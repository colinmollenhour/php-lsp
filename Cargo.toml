[package]
name = "php-lsp"
version = "0.7.0"
edition = "2024"
description = "A PHP Language Server Protocol implementation"
license = "MIT"
repository = "https://github.com/jorgsowa/php-lsp"
readme = "README.md"
exclude = ["docs/"]

[lib]
name = "php_lsp"
path = "src/lib.rs"

[[bin]]
name = "php-lsp"
path = "src/main.rs"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "requests"
harness = false

[[bench]]
name = "semantic"
harness = false

[features]
dhat-heap = ["dep:dhat"]

[dependencies]
dhat = { version = "0.3", optional = true }
mimalloc = { version = "0.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# TEMPORARY: point at upstream mir main, pinned to the merge commit of
# jorgsowa/mir#291 (E1 single-line @template over-read fix, E2
# @template-extends/-implements (+@phpstan-*) alias recognition, E3
# constructor-arg class-template inference + unannotated generic method-return
# resolution). The PR is merged to upstream main but not yet in a crates.io
# release (latest published is 0.31.0). Revert to `mir-* = "=0.3x.0"` once a
# release containing #291 is published.
mir-analyzer = { git = "https://github.com/jorgsowa/mir", rev = "ebf6191e0745defb09571a1d529e91ba0cc7916c" }
mir-issues = { git = "https://github.com/jorgsowa/mir", rev = "ebf6191e0745defb09571a1d529e91ba0cc7916c" }
mir-codebase = { git = "https://github.com/jorgsowa/mir", rev = "ebf6191e0745defb09571a1d529e91ba0cc7916c" }
mir-types = { git = "https://github.com/jorgsowa/mir", rev = "ebf6191e0745defb09571a1d529e91ba0cc7916c" }
php-rs-parser = "0.15"
php-ast = "0.15"
bumpalo = { version = "3", features = ["collections"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
futures = "0.3.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
blake3 = "1"
dashmap = "6"
rayon = "1"
salsa = "0.26"
arc-swap = "1"

[dependencies.walkdir]
version = "2"

[dev-dependencies]
tempfile = "3"
expect-test = "1"
indexmap = "2"
criterion = { version = "0.8", features = ["html_reports"] }
iai-callgrind = "0.16"
serial_test = "3"

[[bench]]
name = "iai_critical"
harness = false

[[bench]]
name = "edit_latency"
harness = false

# Optimize CPU-heavy dependencies in debug/test builds so the test suite
# stays fast without requiring a full release build.  These crates do the
# bulk of the parser and type-inference work; opt-level=1 gives most of the
# runtime speedup (typically 5-10×) at a fraction of the compile time cost
# of opt-level=3.
[profile.dev.package.mir-analyzer]
opt-level = 2
[profile.dev.package.mir-codebase]
opt-level = 2
[profile.dev.package.php-rs-parser]
opt-level = 2
[profile.dev.package.php-ast]
opt-level = 2
[profile.dev.package.php-lexer]
opt-level = 2
[profile.dev.package.salsa]
opt-level = 2
[profile.dev.package.salsa-macro-rules]
opt-level = 2
